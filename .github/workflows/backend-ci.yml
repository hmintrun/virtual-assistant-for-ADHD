name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docs/backend/openapi.json"
      - "docs/backend/fixtures/w4-02/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docs/backend/openapi.json"
      - "docs/backend/fixtures/w4-02/**"

jobs:
  backend-checks:
    name: Ruff, Ty & Pytest (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CALENDAR_PROVIDER_MODE: fake
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Run Ruff linter
        run: uv run ruff check app tests

      - name: Run Ty type checker
        run: uv run ty check app

      - name: Check Alembic single head
        run: uv run python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads(); print('Alembic heads:', heads); assert len(heads) == 1, f'Expected 1 Alembic head, found {len(heads)}: {heads}'"

      - name: Verify W4 API contracts
        run: uv run python -m scripts.export_w4_contracts --check

      - name: Run Pytest suite
        run: uv run pytest -q
