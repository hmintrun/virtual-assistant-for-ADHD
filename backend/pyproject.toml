[project]
name = "proactive-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=24.1",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=42.0",
    "edge-tts>=6.1.12",
    "fastapi>=0.115,<1",
    "google-auth>=2.62.0",
    "google-genai>=1.0",
    "groq>=0.13",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.17",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.32,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
