name: proplan_va
description: "AI-powered proactive voice assistant for adults with ADHD-I."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & Security
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Focus, DND & Notifications
  flutter_dnd:
    path: packages/flutter_dnd
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^17.2.3

  # Audio Recording & On-device Voice
  record: ^5.2.0
  path_provider: ^2.1.6
  audioplayers: ^6.0.0
  flutter_tts: ^4.1.0
  speech_to_text: ^7.0.0

  # UI Components & Timing
  table_calendar: ^3.1.2
  circular_countdown_timer: ^0.2.3
  shimmer: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^8.2.1
  timezone: ^0.9.4
  shared_preferences: ^2.5.6
  android_alarm_manager_plus: ^5.1.2
  url_launcher: ^6.3.3
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  # record 5.x chon record_linux cu, khong tuong thich platform interface 1.5+.
  record_linux: ^1.3.1
